name: Nightly

on:
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-and-storage:
    name: repeated storage, integration, and large dataset tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build time
      - name: Configure and build Release
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 4
      - name: Verify full test registration
        run: |
          ctest --test-dir build/release --show-only=json-v1 > build/release/ctest-inventory.json
          python3 tools/verify_test_registration.py build/release/ctest-inventory.json hyperdb_bridge_tests hyperdb_cli_concurrency_tests hyperdb_sqlite_conformance_tests
      - name: Run complete Release suite
        run: ctest --preset release --output-on-failure
      - name: Repeat storage fault and concurrency coverage
        run: |
          for run in $(seq 1 25); do
            echo "stress pass $run"
            ctest --test-dir build/release --output-on-failure -L 'storage|concurrency'
          done
      - name: Exercise larger equality workload
        run: /usr/bin/time -v ./build/release/hyperdb_benchmark 250000 10 > nightly-large-workload.txt 2> nightly-large-workload-resource.txt
      - name: Report tests not yet supported
        run: |
          {
            echo '## Unsupported nightly scenarios'
            echo '- Power-loss recovery: no WAL/recovery implementation exists.'
            echo '- Fixed 256/128/64/32 KiB memory budgets and fail-after-N allocation tests: not implemented.'
            echo '- Flash endurance/erase interruption and physical RTOS/bare-metal hardware: no supported adapter or hardware runner.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload stress outputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: hyperdb-nightly-${{ github.sha }}
          path: nightly-*-*.txt
          if-no-files-found: error
          retention-days: 30

  extended-fuzz:
    name: one-hour parser fuzzing
    uses: ./.github/workflows/fuzzing.yml
    with:
      max_seconds: 3600

  benchmark:
    name: versioned benchmark artifact
    uses: ./.github/workflows/benchmarks.yml
