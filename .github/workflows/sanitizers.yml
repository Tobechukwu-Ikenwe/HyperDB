name: Sanitizers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure sanitizer
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Verify Python-backed tests registered
        run: |
          ctest --test-dir build/${{ matrix.preset }} --show-only=json-v1 > build/${{ matrix.preset }}/ctest-inventory.json
          python3 tools/verify_test_registration.py build/${{ matrix.preset }}/ctest-inventory.json hyperdb_bridge_tests hyperdb_cli_concurrency_tests hyperdb_sqlite_conformance_tests
      - name: Run full test suite
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
